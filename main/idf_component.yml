## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  ## S2 起 esp_hosted 要求 idf >= 5.5；本工程基线为 v6.1
  idf:
    version: '>=5.5'
  lvgl/lvgl:
    version: '*'
    override_path: '../components/lvgl__lvgl'
  espressif/esp_lvgl_adapter: '*'
  ## S2: ESP-Hosted 3.x host stack (P4) + Wi-Fi remote API 兼容层
  ## C5 侧已烧 ESP-Hosted 3.1.0 cp/ 固件；P4 侧由此获得标准
  ## lwIP / esp_netif / socket。版本范围与独立验证工程保持一致。
  espressif/esp_hosted:
    version: '^3.1.0'
  espressif/esp_wifi_remote:
    version: '>=1.3.1'
